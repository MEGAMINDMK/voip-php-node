<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Voice Chat</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }
    
    #voiceStatus {
      font-size: 14px;
      color: #4ade80;
      margin-bottom: 10px;
      text-align: center;
      padding: 10px;
      font-weight: bold;
    }

    /* --- AUDIO UNLOCK BUTTON --- */
    #unlockBtn {
        width: 100%;
        max-width: 300px;
        padding: 15px;
        margin-bottom: 20px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(59,130,246,0.4);
    }
    #unlockBtn:active {
        transform: scale(0.95);
    }

    /* --- PUSH TO TALK BUTTON --- */
    #voicePttBtn {
        width: 160px; 
        height: 160px; 
        border-radius: 50%;
        background: #ef4444; 
        color: white; 
        border: none;
        font-size: 16px; 
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(239,68,68,0.4);
        touch-action: none; 
        -webkit-tap-highlight-color: transparent;
        transition: all 0.1s;
        user-select: none; 
        -webkit-user-select: none;
    }
    
    #voicePttBtn.talking {
        background: #22c55e !important;
        transform: scale(0.92);
        box-shadow: 0 4px 15px rgba(34,197,94,0.7) !important;
    }

    #debug {
      font-size: 11px;
      color: #888;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      white-space: pre-wrap;
      font-family: monospace;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div style="font-size:18px; margin-bottom: 10px;">🎙️ Push to Talk</div>
  
  <div id="voiceStatus">Connecting...</div>
  
  <!-- NEW: MUST TAP THIS FIRST TO HEAR AUDIO -->
  <button id="unlockBtn" onclick="unlockAudioNow()">🔊 TAP TO ENABLE AUDIO</button>

  <button id="voicePttBtn"
          ontouchstart="event.preventDefault(); startVoiceTalk();"
          ontouchend="event.preventDefault(); stopVoiceTalk();"
          ontouchcancel="stopVoiceTalk();"
          onmousedown="startVoiceTalk();"
          onmouseup="stopVoiceTalk();"
          onmouseleave="stopVoiceTalk();">
      HOLD TO TALK
  </button>

  <div id="debug">Logs will appear here...</div>

  <script src="cordova.js"></script>
  <script>
  // ========================================
  // DEBUG LOGGING
  // ========================================
  let debugMessages = [];
  
  function voiceLog(msg) {
      console.log('[VOICE] ' + msg);
      
      const timestamp = new Date().toLocaleTimeString();
      debugMessages.push(`[${timestamp}] ${msg}`);
      if (debugMessages.length > 15) debugMessages.shift();
      
      const statusEl = document.getElementById('voiceStatus');
      if (statusEl) statusEl.textContent = msg;
      
      const debugDiv = document.getElementById('debug');
      if (debugDiv) {
          debugDiv.textContent = debugMessages.join('\n');
          debugDiv.scrollTop = debugDiv.scrollHeight;
      }
  }

  // ========================================
  // VOICE CHAT CONFIG
  // ========================================
  const VOICE_CONFIG = {
      wsHost: 'wno-host.ddns.net', // <--- CHANGE TO YOUR LAPTOP IP
      wsPort: 27016,
      roomId: 1,
      clientId: Math.floor(Math.random() * 60000) + 1
  };

  let voiceWs = null;
  let voiceAudioCtx = null;
  let voiceMicStream = null;
  let voiceProcessor = null;
  let voiceTalking = false;
  let voiceSeq = 0;
  let voicePlaybackTime = 0;
  let voiceConnected = false;

  // ========================================
  // PERMISSIONS
  // ========================================
  function requestMicPermission() {
      return new Promise((resolve, reject) => {
          if (typeof cordova === 'undefined' || !cordova.plugins.permissions) {
              resolve();
              return;
          }
          const permissions = cordova.plugins.permissions;
          permissions.checkPermission(permissions.RECORD_AUDIO, (status) => {
              if (status.hasPermission) {
                  resolve();
              } else {
                  permissions.requestPermission(permissions.RECORD_AUDIO, (s) => {
                      if (s.hasPermission) resolve();
                      else reject(new Error('Mic permission denied'));
                  }, reject);
              }
          }, reject);
      });
  }

  // ========================================
  // MANUAL AUDIO UNLOCK (TRIGGERED BY BUTTON)
  // ========================================
  async function unlockAudioNow() {
      voiceLog('🔊 Unlocking audio...');
      await initVoiceAudio();
      
      if (voiceAudioCtx) {
          // Play a silent buffer to force unlock
          const buf = voiceAudioCtx.createBuffer(1, 1, 16000);
          const src = voiceAudioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(voiceAudioCtx.destination);
          src.start(0);
          
          voiceLog('🔊 Audio enabled! (ctx=' + voiceAudioCtx.state + ')');
          
          // Hide the button after success
          const btn = document.getElementById('unlockBtn');
          if (btn) {
              btn.style.background = '#22c55e';
              btn.textContent = '✅ AUDIO ENABLED';
              btn.disabled = true;
          }
      }
  }

  // ========================================
  // AUDIO CONTEXT & MIC
  // ========================================
  async function initVoiceAudio() {
      if (voiceAudioCtx && voiceAudioCtx.state === 'running') return;
      
      if (!voiceAudioCtx) {
          voiceAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      }
      
      if (voiceAudioCtx.state === 'suspended') {
          await voiceAudioCtx.resume();
          voiceLog('🔊 AudioContext resumed');
      }
  }

  async function setupVoiceMic() {
      await requestMicPermission();
      try {
          voiceMicStream = await navigator.mediaDevices.getUserMedia({
              audio: { 
                  echoCancellation: true, 
                  noiseSuppression: true, 
                  autoGainControl: true, 
                  channelCount: 1, 
                  sampleRate: 16000 
              }
          });
      } catch (e) {
          voiceLog('❌ Mic denied: ' + e.message); 
          return false;
      }
      
      const source = voiceAudioCtx.createMediaStreamSource(voiceMicStream);
      voiceProcessor = voiceAudioCtx.createScriptProcessor(1024, 1, 1);
      
      voiceProcessor.onaudioprocess = (e) => {
          if (!voiceTalking || !voiceWs || voiceWs.readyState !== WebSocket.OPEN) return;
          
          const input = e.inputBuffer.getChannelData(0);
          const pcm16 = new Int16Array(input.length);
          for (let i = 0; i < input.length; i++) {
              const s = Math.max(-1, Math.min(1, input[i]));
              pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }
          
          const headerLen = 7;
          const packet = new Uint8Array(headerLen + pcm16.length * 2);
          const dv = new DataView(packet.buffer);
          packet[0] = VOICE_CONFIG.roomId;
          dv.setUint16(1, VOICE_CONFIG.clientId, false);
          dv.setUint32(3, voiceSeq++, false);
          
          const outView = new DataView(packet.buffer, headerLen);
          for (let i = 0; i < pcm16.length; i++) {
              outView.setInt16(i * 2, pcm16[i], true);
          }
          
          try { voiceWs.send(packet.buffer); } catch (err) {}
      };
      
      source.connect(voiceProcessor);
      const muteGain = voiceAudioCtx.createGain();
      muteGain.gain.value = 0;
      voiceProcessor.connect(muteGain);
      muteGain.connect(voiceAudioCtx.destination);
      return true;
  }

  // ========================================
  // PLAYBACK
  // ========================================
  function handleVoiceAudio(data) {
      if (!voiceAudioCtx) return;
      const buf = new Uint8Array(data);
      if (buf.length < 7) return;
      
      const dv = new DataView(buf.buffer);
      const senderId = dv.getUint16(1, false);
      if (senderId === VOICE_CONFIG.clientId) return;
      
      const payloadLen = buf.length - 7;
      if (payloadLen < 2) return;
      
      // DEBUG LOG: See if audio is arriving
      voiceLog('📥 Playing ' + payloadLen + ' bytes (ctx=' + voiceAudioCtx.state + ')');
      
      const sampleCount = payloadLen >> 1;
      const pcmView = new DataView(buf.buffer, 7);
      const f32 = new Float32Array(sampleCount);
      
      for (let i = 0; i < sampleCount; i++) {
          f32[i] = pcmView.getInt16(i * 2, true) / 32768;
      }
      
      const audioBuffer = voiceAudioCtx.createBuffer(1, sampleCount, 16000);
      audioBuffer.getChannelData(0).set(f32);
      
      const src = voiceAudioCtx.createBufferSource();
      src.buffer = audioBuffer; 
      src.connect(voiceAudioCtx.destination);
      
      const now = voiceAudioCtx.currentTime;
      if (voicePlaybackTime < now + 0.01) voicePlaybackTime = now + 0.05;
      src.start(voicePlaybackTime);
      voicePlaybackTime += audioBuffer.duration;
  }

  // ========================================
  // WEBSOCKET CONNECTION
  // ========================================
  function connectVoice() {
      if (voiceWs && voiceWs.readyState === WebSocket.OPEN) return;
      
      const url = `ws://${VOICE_CONFIG.wsHost}:${VOICE_CONFIG.wsPort}`;
      voiceLog('Connecting...');
      
      voiceWs = new WebSocket(url);
      voiceWs.binaryType = 'arraybuffer';
      
      voiceWs.onopen = async () => {
          // Send JOIN packet
          const join = new Uint8Array(6);
          join[0] = 0xFF;
          new DataView(join.buffer).setUint32(1, VOICE_CONFIG.clientId, false);
          join[5] = VOICE_CONFIG.roomId;
          voiceWs.send(join.buffer);
          
          voiceConnected = true;
          voiceLog('✅ Connected · ID ' + VOICE_CONFIG.clientId);
          
          // We NO LONGER auto-init audio here. User must tap the button.
          // await initVoiceAudio();
          // await setupVoiceMic();
          
          // Heartbeat every 5s to prevent timeout
          setInterval(() => {
              if (voiceWs.readyState !== WebSocket.OPEN) return;
              const hb = new Uint8Array(7);
              hb[0] = VOICE_CONFIG.roomId;
              new DataView(hb.buffer).setUint16(1, VOICE_CONFIG.clientId, false);
              new DataView(hb.buffer).setUint32(3, voiceSeq++, false);
              voiceWs.send(hb.buffer);
          }, 5000);

          // Tiny ping to force Android WebView to stay awake
          setInterval(() => {
              if (voiceWs.readyState === WebSocket.OPEN) {
                  voiceWs.send(new Uint8Array([0x00]));
              }
          }, 1000);
      };
      
      voiceWs.onmessage = (ev) => { 
          console.log("RAW WS DATA RECEIVED:", ev.data);
          
          if (ev.data instanceof ArrayBuffer) { 
              handleVoiceAudio(ev.data); 
          }
      };
      
      voiceWs.onclose = () => { 
          voiceConnected = false; 
          voiceLog('❌ Disconnected — reconnecting...'); 
          setTimeout(connectVoice, 2000); 
      };
      
      voiceWs.onerror = (e) => { 
          voiceLog('❌ WS error'); 
          console.error(e); 
      };
  }

  // ========================================
  // PUSH TO TALK
  // ========================================
  async function startVoiceTalk() {
      // Ensure audio is unlocked first
      if (!voiceAudioCtx || voiceAudioCtx.state !== 'running') {
          voiceLog('⚠️ Tap "ENABLE AUDIO" first!');
          return;
      }

      if (!voiceMicStream) {
          const ok = await setupVoiceMic();
          if (!ok) return;
      }
      
      voiceTalking = true;
      const btn = document.getElementById('voicePttBtn');
      if (btn) { 
          btn.classList.add('talking'); 
          btn.textContent = '🎤 TALKING'; 
      }
  }

  function stopVoiceTalk() {
      voiceTalking = false;
      const btn = document.getElementById('voicePttBtn');
      if (btn) { 
          btn.classList.remove('talking'); 
          btn.textContent = 'HOLD TO TALK'; 
      }
  }

  // ========================================
  // INITIALIZATION
  // ========================================
  document.addEventListener('deviceready', function() {
      voiceLog('Device ready. Connecting...');
      
      if (window.plugins && window.plugins.insomnia) {
          window.plugins.insomnia.keepAwake();
      }
      
      connectVoice();
  }, false);

  // Fallback for browser testing
  if (typeof cordova === 'undefined') {
      window.addEventListener('load', () => {
          voiceLog('Browser mode. Connecting...');
          connectVoice();
      });
  }

  </script>
</body>
</html>
